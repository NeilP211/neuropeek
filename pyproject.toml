[project]
name = "circuitprobe"
version = "0.1.0"
description = "Mechanistic interpretability: reproducing + extending Olsson '22 induction heads on Pythia."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neil Patel" }]
dependencies = [
    "torch>=2.3",
    "transformer-lens>=2.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "einops>=0.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "plotly>=5.20",
    "circuitsvis>=1.43",
    "tqdm>=4.66",
    "wandb>=0.17",
    "scipy>=1.13",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
triton = [
    "triton>=2.3 ; platform_system == 'Linux'",
]
demo = [
    "gradio>=6.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuitprobe"]

[tool.pytest.ini_options]
markers = [
    "slow: requires network or model download",
    "gpu: requires CUDA GPU",
]

[dependency-groups]
dev = [
    "kaleido>=1.3.0",
]
